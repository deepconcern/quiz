server {
  listen 5173;

  root   /usr/share/nginx/html;
  index  index.html index.htm;

  location = /index.html {
    add_header Cache-Control "no-cache, max-age=0, mustrevalidate, no-store, proxy-revalidate";
    add_header Expires 0;
  }

  location / {
    try_files $uri /index.html =404;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}